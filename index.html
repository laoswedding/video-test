<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hero video test</title>
<style>
  :root {
    --bg: #14161a;
    --text: #f2f2f0;
    --muted: #a3a8b0;
    --panel: rgba(20, 22, 26, 0.82);
    --accent: #6fd3c0;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
  }

  /* Hero */
  .hero {
    position: relative;
    height: 70vh;
    min-height: 360px;
    overflow: hidden;
    background: #000;
  }
  .hero video {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .hero-copy {
    position: relative;
    z-index: 1;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 2rem clamp(1.25rem, 5vw, 4rem);
    background: linear-gradient(to top, rgba(0,0,0,.65), transparent 55%);
  }
  .hero-copy h1 { font-size: clamp(2rem, 6vw, 4rem); font-weight: 700; letter-spacing: -0.02em; }
  .hero-copy p { color: #e0e0dc; max-width: 40ch; }

  /* Test panel */
  .panel {
    max-width: 720px;
    margin: 0 auto;
    padding: 2rem clamp(1.25rem, 5vw, 2rem) 4rem;
  }
  .panel h2 { font-size: 1.1rem; margin-bottom: .75rem; }
  .row { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; margin-bottom: 1.5rem; }
  label.pick {
    background: var(--accent);
    color: #0c1a17;
    padding: .55rem 1rem;
    border-radius: 6px;
    font-weight: 600;
    cursor: pointer;
  }
  label.pick:focus-within { outline: 2px solid #fff; outline-offset: 2px; }
  label.pick input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .hint { color: var(--muted); font-size: .9rem; }

  dl {
    display: grid;
    grid-template-columns: max-content 1fr;
    gap: .4rem 1.25rem;
    font-variant-numeric: tabular-nums;
  }
  dt { color: var(--muted); }
  dd { font-weight: 500; }
  code { background: #23262c; padding: .1rem .35rem; border-radius: 4px; font-size: .9em; }

  @media (prefers-reduced-motion: reduce) {
    .hero video { display: none; }
    .hero { background: #1d2026; }
  }
</style>
</head>
<body>

<header class="hero">
  <!-- Change "output.mp4" if your file has a different name -->
  <video id="vid" autoplay muted loop playsinline preload="auto">
    <source src="output.mp4" type="video/mp4">
  </video>
  <div class="hero-copy">
    <h1>Hero video test</h1>
    <p>If the video plays behind this text, it's working.</p>
  </div>
</header>

<main class="panel">
  <h2>Load check</h2>
  <div class="row">
    <label class="pick">
      Choose a video file
      <input id="file" type="file" accept="video/*">
    </label>
    <span class="hint">Or put <code>output.mp4</code> in the same folder as this page.</span>
  </div>

  <dl>
    <dt>Source</dt><dd id="s-src">output.mp4</dd>
    <dt>File size</dt><dd id="s-size">n/a (only known for picked files)</dd>
    <dt>Dimensions</dt><dd id="s-dim">waiting…</dd>
    <dt>Duration</dt><dd id="s-dur">waiting…</dd>
    <dt>Time to first frame</dt><dd id="s-first">waiting…</dd>
    <dt>Status</dt><dd id="s-status">loading…</dd>
  </dl>
</main>

<script>
  const vid = document.getElementById('vid');
  const $ = id => document.getElementById(id);
  let t0 = performance.now();

  function resetStats() {
    t0 = performance.now();
    $('s-dim').textContent = 'waiting…';
    $('s-dur').textContent = 'waiting…';
    $('s-first').textContent = 'waiting…';
    $('s-status').textContent = 'loading…';
  }

  vid.addEventListener('loadedmetadata', () => {
    $('s-dim').textContent = vid.videoWidth + ' × ' + vid.videoHeight;
    $('s-dur').textContent = vid.duration.toFixed(1) + ' s';
  });
  vid.addEventListener('loadeddata', () => {
    $('s-first').textContent = Math.round(performance.now() - t0) + ' ms';
  });
  vid.addEventListener('playing', () => { $('s-status').textContent = 'playing'; });
  vid.addEventListener('error', () => {
    $('s-status').textContent = 'could not load (check the file name/location or codec support)';
  });

  $('file').addEventListener('change', e => {
    const f = e.target.files[0];
    if (!f) return;
    resetStats();
    $('s-src').textContent = f.name;
    $('s-size').textContent = (f.size / 1024 / 1024).toFixed(2) + ' MB';
    vid.src = URL.createObjectURL(f);
    vid.play().catch(() => {});
  });
</script>
</body>
</html>
